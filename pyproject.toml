[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-switch"
dynamic = ["version"]
description = "Manage Codex and Claude Code profiles, baselines and native session continuation."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "tomlkit==0.13.3",
    "psutil==7.0.0",
    "distlib==0.3.9",
]

[project.scripts]
ai-switch = "ai_switch.cli:main"

[tool.setuptools.dynamic]
version = {attr = "ai_switch._version.VERSION"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ai_switch.resources" = [
    "read_guard.py",
    "templates/aster/README.md",
    "templates/aster/claude.json",
    "templates/aster/codex.json",
]

